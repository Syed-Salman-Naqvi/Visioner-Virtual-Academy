name: OpenCode Analysis

on:
  issue_comment:
    types: [created]
  push:
    branches: [ "main" ]

jobs:
  opencode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OpenCode Action
        uses: opencode-ai/opencode-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
