name: Update Admissions Grade Options

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-grades:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update admissions grade options
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/admissions/page.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace('gradeLevel: "grade-11"', 'gradeLevel: "grade-1"')

          pattern = re.compile(
              r'(?P<indent>\s*)<option value="grade-9">Grade 9 / Year 10 \(IGCSE\)</option>\s*'
              r'<option value="grade-10">Grade 10 / Year 11 \(IGCSE\)</option>\s*'
              r'<option value="grade-11">Grade 11 / Year 12 \(AS-Level / AP\)</option>\s*'
              r'<option value="grade-12">Grade 12 / Year 13 \(A2-Level / AP\)</option>\s*'
              r'<option value="grade-6-8">Grades 6 - 8 \(Middle School\)</option>'
          )

          replacement = (
              r'\g<indent><option value="grade-1">Grade 1</option>\n'
              r'\g<indent><option value="grade-2">Grade 2</option>\n'
              r'\g<indent><option value="grade-3">Grade 3</option>\n'
              r'\g<indent><option value="grade-4">Grade 4</option>\n'
              r'\g<indent><option value="grade-5">Grade 5</option>\n'
              r'\g<indent><option value="grade-6">Grade 6</option>\n'
              r'\g<indent><option value="grade-7">Grade 7</option>\n'
              r'\g<indent><option value="grade-8">Grade 8</option>\n'
              r'\g<indent><option value="grade-9">Grade 9</option>\n'
              r'\g<indent><option value="grade-10">Grade 10</option>'
          )

          updated, count = pattern.subn(replacement, text)
          if count == 0:
              raise SystemExit('Expected admissions grade option block was not found; no change made.')

          path.write_text(updated, encoding='utf-8')
          print(f'Updated {count} grade option block(s).')

      - name: Commit admissions change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admissions/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Set admissions grades to 1-10 [skip ci]"
          git push